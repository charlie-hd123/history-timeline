<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>
  <style>
    html,
    body {
      margin: 0;
      background: #f6f6f6;
      font-family: Arial, sans-serif;
    }

    .timeline-container {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: white;
    }

    .timeline-svg {
      width: 4000px;
      height: auto;
      display: block;
      border: 0;
    }

    @media (min-width: 800px) {
      .timeline-svg {
        width: 15000px;
      }
    }
  </style>
</head>
<body>
  <div class="timeline-container">
    <object
      data="assets/timeline.svg"
      type="image/svg+xml"
      class="timeline-svg"
      aria-label="History timeline">
    </object>
  </div>
</body>
</html>
