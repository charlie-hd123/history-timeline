    body {
      margin: 0;

    /* Fixed buttons */
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 6px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 42px);

      gap: 5px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #dpad.hidden {
      opacity: 0;
      pointer-events: none;
    }
