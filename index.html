
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>History Timeline</title>

  <style>
    /* Page basics */
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fixed buttons */
    #controls {
      position: fixed;
      top: 12px;
      left: 10px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(96, 96, 96, 0.72);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      opacity: 1;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }

    #zoomControls {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(96, 96, 96, 0.72);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      opacity: 1;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }

    #controls.hidden,
    #zoomControls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #dpad {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 36px);
      grid-template-rows: repeat(3, 36px);
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(96, 96, 96, 0.72);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      opacity: 1;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }

    #dpad.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #wakeLayer {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: transparent;
      display: none;
    }

    #wakeLayer.active {
      display: block;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.15;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      white-space: nowrap;
      min-width: 44px;
    }

    button:active {
      background: rgba(255, 255, 255, 0.16);
    }

    button:focus,
    button:focus-visible {
      outline: none;
    }

    #controls button {
      min-height: 42px;
      min-width: 52px;
    }

    #tabletDisplayBtn {
      display: none;
    }

    #dpad button {
      padding: 6px;
      font-size: 17px;
      min-width: 42px;
      min-height: 42px;
    }

    #zoomControls button {
      min-width: 56px;
      min-height: 56px;
      padding: 4px;
      font-size: 26px;
    }

    #upBtn {
      grid-column: 2;
      grid-row: 1;
    }

    #leftBtn {
      grid-column: 1;
      grid-row: 2;
    }

    #rightBtn {
      grid-column: 3;
      grid-row: 2;
    }

    #downBtn {
      grid-column: 2;
      grid-row: 3;
    }

    /* Timeline viewing area */
    #timeline {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: auto;
      background: #e8e8e8;
      overscroll-behavior: none;
      scrollbar-width: none;
      touch-action: pan-x pan-y;
    }

    #timeline::-webkit-scrollbar {
      display: none;
    }

    /* Mobile timeline size */
    #timelineSvg {
      width: 7600px;
      height: auto;
      display: block;
      touch-action: pan-x pan-y;
    }

    #timelineSvg > svg,
    #timelineSvgFallback {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: pan-x pan-y;
    }

    /* Tablet timeline size */
    @media (min-width: 800px) {
      #timelineSvg {
        width: 13000px;
      }
    }

    @media (min-width: 800px) and (pointer: coarse) {
      #tabletDisplayBtn {
        display: inline-block;
      }
    }

    /* Computer timeline size */
    @media (min-width: 1200px) {
      #timelineSvg {
        width: 16000px;
      }
    }

    @media (max-width: 799px) {
      #controls {
        top: 8px;
        left: 8px;
        max-width: calc(100vw - 16px);
        padding: 4px;
        gap: 6px;
      }

      #zoomControls {
        right: 8px;
        bottom: 8px;
        padding: 4px;
        gap: 6px;
      }

      button {
        border-radius: 5px;
        font-size: 11px;
        padding: 6px 8px;
        min-width: 30px;
      }

      #controls button {
        min-height: 30px;
        min-width: 34px;
      }

      #dpad {
        left: 8px;
        bottom: 8px;
        grid-template-columns: repeat(3, 30px);
        grid-template-rows: repeat(3, 30px);
        padding: 4px;
        gap: 3px;
      }

      #dpad button {
        min-width: 30px;
        min-height: 30px;
        padding: 3px;
        font-size: 12px;
      }

      #zoomControls button {
        min-width: 42px;
        min-height: 42px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="wakeLayer" aria-hidden="true"></div>

  <!-- Main controls -->
  <div id="controls">
    <button id="fullscreenBtn">Full Screen</button>
    <button id="resetViewBtn">Reset View</button>
    <button id="tabletDisplayBtn">Tablet Display Mode</button>
    <button id="autoScrollBtn">Auto Scroll</button>
  </div>

  <!-- Timeline zoom controls -->
  <div id="zoomControls">
    <button id="zoomOutBtn">-</button>
    <button id="zoomInBtn">+</button>
  </div>

  <!-- Movement buttons in a D-pad layout -->
  <div id="dpad">
    <button id="upBtn">↑</button>
    <button id="leftBtn">←</button>
    <button id="rightBtn">→</button>
    <button id="downBtn">↓</button>
  </div>

  <!-- Timeline SVG -->
  <div id="timeline">
    <div id="timelineSvg" role="img" aria-label="History timeline">
      <object id="timelineSvgFallback" data="assets/timeline.svg" type="image/svg+xml" aria-label="History timeline"></object>
    </div>
  </div>

  <script>
    // Auto-scrolls the timeline slowly left and right
    const timeline = document.getElementById("timeline");
    const timelineSvg = document.getElementById("timelineSvg");
    const timelineSvgFallback = document.getElementById("timelineSvgFallback");
    const controls = document.getElementById("controls");
    const zoomControls = document.getElementById("zoomControls");
    const dpad = document.getElementById("dpad");
    const wakeLayer = document.getElementById("wakeLayer");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const autoScrollBtn = document.getElementById("autoScrollBtn");
    const tabletDisplayBtn = document.getElementById("tabletDisplayBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const upBtn = document.getElementById("upBtn");
    const downBtn = document.getElementById("downBtn");
    const timelineSvgPath = "assets/timeline.svg";
    const zoomStep = 0.15;
    const desktopDefaultZoom = 1.45;
    const defaultZoom = isTabletDevice() ? desktopDefaultZoom - zoomStep * 3 : desktopDefaultZoom;
    const arrowStep = 120;
    const tabletDisplaySettings = {
      zoom: 1.6,
      horizontalRatio: 0,
      verticalRatio: 0.62
    };

    let direction = 1;
    let zoom = defaultZoom;
    let hideControlsTimer;
    let autoScrollTimer;
    let autoScrolling = false;
    let svgAspectRatio = null;
    let initialViewApplied = false;
    const interactionEvents = [
      "click",
      "mousedown",
      "mousemove",
      "pointerdown",
      "pointermove",
      "touchmove",
      "touchstart",
      "wheel",
      "keydown"
    ];

    function isTabletDevice() {
      return window.matchMedia("(min-width: 800px) and (pointer: coarse)").matches;
    }

    function getBaseWidth() {
      if (window.innerWidth >= 1200) return 16000;
      if (window.innerWidth >= 800) return 13000;
      return 7600;
    }

    function updateTimelineSize() {
      const width = getBaseWidth() * zoom;

      timelineSvg.style.width = `${width}px`;

      if (svgAspectRatio) {
        timelineSvg.style.height = `${width * svgAspectRatio}px`;
      }
    }

    function measureTimelineSvg() {
      const measurementImage = document.createElement("img");

      measurementImage.addEventListener("load", () => {
        if (measurementImage.naturalWidth > 0 && measurementImage.naturalHeight > 0) {
          svgAspectRatio = measurementImage.naturalHeight / measurementImage.naturalWidth;
          updateTimelineSize();
          setDefaultView();
        }
      });

      measurementImage.src = timelineSvgPath;
    }

    async function loadInlineTimelineSvg() {
      try {
        const response = await fetch(timelineSvgPath);
        if (!response.ok) return;

        const svgText = await response.text();
        const svgDocument = new DOMParser().parseFromString(svgText, "image/svg+xml");
        const svgElement = svgDocument.documentElement;

        if (svgElement.tagName.toLowerCase() !== "svg") return;

        svgElement.removeAttribute("width");
        svgElement.removeAttribute("height");
        svgElement.setAttribute("focusable", "false");
        svgElement.style.width = "100%";
        svgElement.style.height = "100%";
        svgElement.style.display = "block";

        timelineSvg.replaceChildren(document.importNode(svgElement, true));
        addInteractionListeners(timelineSvg);
        blockBrowserPinchZoom(timelineSvg);
        updateTimelineSize();
        setDefaultView();
      } catch (error) {
        console.warn("Inline SVG loading is unavailable; using embedded fallback.", error);
      }
    }

    function stopBrowserPinchZoom(event) {
      if (event.touches && event.touches.length > 1) {
        event.preventDefault();
      }
    }

    function blockBrowserPinchZoom(target) {
      target.addEventListener("touchmove", stopBrowserPinchZoom, { passive: false });
      target.addEventListener("gesturestart", (event) => event.preventDefault(), { passive: false });
      target.addEventListener("gesturechange", (event) => event.preventDefault(), { passive: false });
    }

    function showControls() {
      controls.classList.remove("hidden");
      zoomControls.classList.remove("hidden");
      dpad.classList.remove("hidden");
      wakeLayer.classList.remove("active");
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        controls.classList.add("hidden");
        zoomControls.classList.add("hidden");
        dpad.classList.add("hidden");
        wakeLayer.classList.add("active");
      }, 5000);
    }

    function addInteractionListeners(target) {
      interactionEvents.forEach((eventName) => {
        target.addEventListener(eventName, showControls, { passive: true });
      });
    }

    function addSvgInteractionListeners() {
      try {
        const svgDocument = timelineSvgFallback.contentDocument || timelineSvgFallback.getSVGDocument?.();
        const svgWindow = svgDocument?.defaultView;

        if (svgDocument) addInteractionListeners(svgDocument);
        if (svgWindow) addInteractionListeners(svgWindow);
        if (svgDocument) blockBrowserPinchZoom(svgDocument);
        if (svgWindow) blockBrowserPinchZoom(svgWindow);
      } catch (error) {
        console.warn("Could not attach timeline interaction listeners.", error);
      }
    }

    function setZoom(nextZoom) {
      const oldRect = timelineSvg.getBoundingClientRect();
      const oldCenterX = timeline.scrollLeft + timeline.clientWidth / 2;
      const oldCenterY = timeline.scrollTop + timeline.clientHeight / 2;
      const centerXRatio = oldRect.width ? oldCenterX / oldRect.width : 0.5;
      const centerYRatio = oldRect.height ? oldCenterY / oldRect.height : 0.5;

      applyZoom(nextZoom);

      requestAnimationFrame(() => {
        const newRect = timelineSvg.getBoundingClientRect();

        timeline.scrollLeft = centerXRatio * newRect.width - timeline.clientWidth / 2;
        timeline.scrollTop = centerYRatio * newRect.height - timeline.clientHeight / 2;

        showControls();
      });
    }

    function setTimelineView(horizontalRatio, verticalRatio) {
      const rect = timelineSvg.getBoundingClientRect();

      timeline.scrollLeft = rect.width * horizontalRatio;
      timeline.scrollTop = rect.height * verticalRatio - timeline.clientHeight / 2;
    }

    function applyZoom(nextZoom) {
      zoom = Math.min(Math.max(nextZoom, 0.25), 6);
      updateTimelineSize();
    }

    function handleBrowserZoomShortcut(event) {
      if (!event.metaKey && !event.ctrlKey) return;

      const key = event.key;
      const code = event.code;
      const isZoomIn = key === "+" || key === "=" || code === "Equal" || code === "NumpadAdd";
      const isZoomOut = key === "-" || code === "Minus" || code === "NumpadSubtract";
      const isReset = key === "0" || code === "Digit0" || code === "Numpad0";

      if (!isZoomIn && !isZoomOut && !isReset) return;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();

      if (isZoomIn) setZoom(zoom + zoomStep);
      if (isZoomOut) setZoom(zoom - zoomStep);
      if (isReset) {
        resetView();
      }
    }

    function releaseButtonFocus(event) {
      const button = event.currentTarget;
      setTimeout(() => button.blur(), 0);
    }

    function setDefaultView() {
      if (initialViewApplied) return;

      requestAnimationFrame(() => {
        timeline.scrollLeft = 0;
        timeline.scrollTop = 0;
        initialViewApplied = true;
      });
    }

    function resetView() {
      applyZoom(defaultZoom);
      timeline.scrollLeft = 0;
      timeline.scrollTop = 0;
      showControls();
    }

    async function startTabletDisplayMode() {
      showControls();

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);
      }

      stopAutoScroll();
      timeline.scrollLeft = 0;
      timeline.scrollTop = 0;
      applyZoom(defaultZoom);
      applyZoom(tabletDisplaySettings.zoom);

      requestAnimationFrame(() => {
        setTimelineView(tabletDisplaySettings.horizontalRatio, tabletDisplaySettings.verticalRatio);

        if (!autoScrolling) {
          direction = 1;
          startAutoScroll();
        }

        showControls();
      });
    }

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = "Exit";
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = "Full Screen";
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);
      }

      showControls();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "Exit" : "Full Screen";
      showControls();
    });

    function startAutoScroll() {
      autoScrolling = true;
      autoScrollBtn.textContent = "Stop Scroll";

      autoScrollTimer = setInterval(() => {
        const maxScroll = timeline.scrollWidth - timeline.clientWidth;

        if (maxScroll <= 0) return;

        timeline.scrollLeft += direction * 1;

        if (timeline.scrollLeft >= maxScroll) direction = -1;
        if (timeline.scrollLeft <= 0) direction = 1;
      }, 50);
    }

    function stopAutoScroll() {
      autoScrolling = false;
      autoScrollBtn.textContent = "Auto Scroll";
      clearInterval(autoScrollTimer);
    }

    autoScrollBtn.addEventListener("click", () => {
      if (autoScrolling) {
        stopAutoScroll();
      } else {
        startAutoScroll();
      }

      showControls();
    });

    tabletDisplayBtn.addEventListener("click", startTabletDisplayMode);

    zoomInBtn.addEventListener("click", () => setZoom(zoom + zoomStep));
    zoomOutBtn.addEventListener("click", () => setZoom(zoom - zoomStep));
    resetViewBtn.addEventListener("click", resetView);

    leftBtn.addEventListener("click", () => {
      timeline.scrollBy({ left: -arrowStep, behavior: "smooth" });
      showControls();
    });

    rightBtn.addEventListener("click", () => {
      timeline.scrollBy({ left: arrowStep, behavior: "smooth" });
      showControls();
    });

    upBtn.addEventListener("click", () => {
      timeline.scrollBy({ top: -arrowStep, behavior: "smooth" });
      showControls();
    });

    downBtn.addEventListener("click", () => {
      timeline.scrollBy({ top: arrowStep, behavior: "smooth" });
      showControls();
    });

    addInteractionListeners(document);
    addInteractionListeners(window);
    addInteractionListeners(timeline);
    addInteractionListeners(timelineSvg);
    addInteractionListeners(wakeLayer);
    blockBrowserPinchZoom(document);
    blockBrowserPinchZoom(timeline);
    blockBrowserPinchZoom(timelineSvg);
    blockBrowserPinchZoom(wakeLayer);
    [
      fullscreenBtn,
      autoScrollBtn,
      tabletDisplayBtn,
      zoomInBtn,
      zoomOutBtn,
      resetViewBtn,
      leftBtn,
      rightBtn,
      upBtn,
      downBtn
    ].forEach((button) => {
      button.addEventListener("click", releaseButtonFocus);
      button.addEventListener("touchend", releaseButtonFocus, { passive: true });
      button.addEventListener("pointerup", releaseButtonFocus, { passive: true });
    });
    window.addEventListener("keydown", handleBrowserZoomShortcut, { capture: true });
    document.addEventListener("keydown", handleBrowserZoomShortcut, { capture: true });
    timelineSvgFallback.addEventListener("load", addSvgInteractionListeners);

    window.addEventListener("resize", () => {
      setZoom(zoom);
      showControls();
    });

    if (window.visualViewport) {
      visualViewport.addEventListener("resize", showControls);
    }

    updateTimelineSize();
    measureTimelineSvg();
    loadInlineTimelineSvg();
    showControls();
  </script>
</body>
</html>
