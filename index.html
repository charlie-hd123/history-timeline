
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>History Timeline</title>

  <style>
    /* Page basics */
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    /* Fixed buttons */
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #dpad {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 42px);
      gap: 5px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #dpad.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #wakeLayer {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: transparent;
      display: none;
    }

    #wakeLayer.active {
      display: block;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: rgba(120, 120, 120, 0.82);
      color: white;
      font-size: 15px;
      line-height: 1.15;
      cursor: pointer;
      white-space: nowrap;
      min-width: 50px;
    }

    #controls button {
      min-height: 44px;
      min-width: 58px;
    }

    #zoomControls {
      display: flex;
      gap: 6px;
    }

    #topControls {
      display: flex;
      gap: 6px;
    }

    #scrollControls {
      display: flex;
      gap: 6px;
    }

    #dpad button {
      padding: 8px;
      font-size: 16px;
      min-width: 42px;
    }

    #upBtn {
      grid-column: 2;
      grid-row: 1;
    }

    #leftBtn {
      grid-column: 1;
      grid-row: 2;
    }

    #rightBtn {
      grid-column: 3;
      grid-row: 2;
    }

    #downBtn {
      grid-column: 2;
      grid-row: 3;
    }

    /* Timeline viewing area */
    #timeline {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: auto;
      background: #e8e8e8;
      overscroll-behavior: none;
      scrollbar-width: none;
      touch-action: none;
    }

    #timeline::-webkit-scrollbar {
      display: none;
    }

    /* Mobile timeline size */
    #timelineSvg {
      width: 7600px;
      height: auto;
      display: block;
      touch-action: none;
    }

    /* Tablet timeline size */
    @media (min-width: 800px) {
      #timelineSvg {
        width: 13000px;
      }
    }

    /* Computer timeline size */
    @media (min-width: 1200px) {
      #timelineSvg {
        width: 16000px;
      }
    }
  </style>
</head>
<body>
  <div id="wakeLayer" aria-hidden="true"></div>

  <!-- Buttons that stay fixed in the top-left corner -->
  <div id="controls">
    <div id="topControls">
      <button id="fullscreenBtn">Full Screen</button>
      <div id="zoomControls">
        <button id="zoomInBtn">+</button>
        <button id="zoomOutBtn">-</button>
        <button id="resetZoomBtn">Reset Zoom</button>
      </div>
    </div>
    <div id="scrollControls">
      <button id="autoScrollBtn">Auto Scroll</button>
      <button id="tabletDisplayBtn">Tablet Display Mode</button>
    </div>
  </div>

  <!-- Movement buttons in a D-pad layout -->
  <div id="dpad">
    <button id="upBtn">↑</button>
    <button id="leftBtn">←</button>
    <button id="rightBtn">→</button>
    <button id="downBtn">↓</button>
  </div>

  <!-- Timeline SVG -->
  <div id="timeline">
    <object id="timelineSvg" data="assets/timeline.svg" type="image/svg+xml" aria-label="History timeline"></object>
  </div>

  <script>
    // Auto-scrolls the timeline slowly left and right
    const timeline = document.getElementById("timeline");
    const timelineSvg = document.getElementById("timelineSvg");
    const controls = document.getElementById("controls");
    const dpad = document.getElementById("dpad");
    const wakeLayer = document.getElementById("wakeLayer");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const autoScrollBtn = document.getElementById("autoScrollBtn");
    const tabletDisplayBtn = document.getElementById("tabletDisplayBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const resetZoomBtn = document.getElementById("resetZoomBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const upBtn = document.getElementById("upBtn");
    const downBtn = document.getElementById("downBtn");
    const timelineSvgPath = "assets/timeline.svg";
    const tabletDisplaySettings = {
      zoom: 1.6,
      horizontalRatio: 0,
      verticalRatio: 0.62
    };

    let direction = 1;
    let zoom = 1;
    let hideControlsTimer;
    let autoScrollTimer;
    let autoScrolling = false;
    let svgAspectRatio = null;
    let pinchStartDistance = null;
    let pinchStartZoom = 1;
    let pinchAnchorXRatio = 0.5;
    let pinchAnchorYRatio = 0.5;
    let pinchMidpointX = 0;
    let pinchMidpointY = 0;
    let panPointerId = null;
    let panLastX = 0;
    let panLastY = 0;
    let panHasMoved = false;
    const activePointers = new Map();
    const interactionEvents = [
      "click",
      "mousedown",
      "mousemove",
      "pointerdown",
      "pointermove",
      "scroll",
      "touchmove",
      "touchstart",
      "wheel",
      "keydown"
    ];

    function getBaseWidth() {
      if (window.innerWidth >= 1200) return 16000;
      if (window.innerWidth >= 800) return 13000;
      return 7600;
    }

    function updateTimelineSize() {
      const width = getBaseWidth() * zoom;

      timelineSvg.style.width = `${width}px`;

      if (svgAspectRatio) {
        timelineSvg.style.height = `${width * svgAspectRatio}px`;
      }
    }

    function measureTimelineSvg() {
      const measurementImage = document.createElement("img");

      measurementImage.addEventListener("load", () => {
        if (measurementImage.naturalWidth > 0 && measurementImage.naturalHeight > 0) {
          svgAspectRatio = measurementImage.naturalHeight / measurementImage.naturalWidth;
          updateTimelineSize();
        }
      });

      measurementImage.src = timelineSvgPath;
    }

    function showControls() {
      controls.classList.remove("hidden");
      dpad.classList.remove("hidden");
      wakeLayer.classList.remove("active");
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        controls.classList.add("hidden");
        dpad.classList.add("hidden");
        wakeLayer.classList.add("active");
      }, 5000);
    }

    function addInteractionListeners(target) {
      interactionEvents.forEach((eventName) => {
        target.addEventListener(eventName, showControls, { passive: true });
      });
    }

    function addSvgInteractionListeners() {
      try {
        const svgDocument = timelineSvg.contentDocument || timelineSvg.getSVGDocument?.();
        const svgWindow = svgDocument?.defaultView;

        if (svgDocument) addInteractionListeners(svgDocument);
        if (svgWindow) addInteractionListeners(svgWindow);
        if (svgDocument) addPinchZoomListeners(svgDocument);
        if (svgWindow) addPinchZoomListeners(svgWindow);
      } catch (error) {
        console.warn("Could not attach timeline interaction listeners.", error);
      }
    }

    function setZoom(nextZoom) {
      const oldRect = timelineSvg.getBoundingClientRect();
      const oldCenterX = timeline.scrollLeft + timeline.clientWidth / 2;
      const oldCenterY = timeline.scrollTop + timeline.clientHeight / 2;
      const centerXRatio = oldRect.width ? oldCenterX / oldRect.width : 0.5;
      const centerYRatio = oldRect.height ? oldCenterY / oldRect.height : 0.5;

      applyZoom(nextZoom);

      requestAnimationFrame(() => {
        const newRect = timelineSvg.getBoundingClientRect();

        timeline.scrollLeft = centerXRatio * newRect.width - timeline.clientWidth / 2;
        timeline.scrollTop = centerYRatio * newRect.height - timeline.clientHeight / 2;

        showControls();
      });
    }

    function getTouchDistance(touches) {
      const deltaX = touches[0].clientX - touches[1].clientX;
      const deltaY = touches[0].clientY - touches[1].clientY;

      return Math.hypot(deltaX, deltaY);
    }

    function getTouchMidpoint(touches) {
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }

    function getPointDistance(points) {
      const deltaX = points[0].clientX - points[1].clientX;
      const deltaY = points[0].clientY - points[1].clientY;

      return Math.hypot(deltaX, deltaY);
    }

    function getPointMidpoint(points) {
      return {
        x: (points[0].clientX + points[1].clientX) / 2,
        y: (points[0].clientY + points[1].clientY) / 2
      };
    }

    function setZoomAtViewportPoint(nextZoom, viewportX, viewportY, anchorXRatio, anchorYRatio) {
      applyZoom(nextZoom);

      const newRect = timelineSvg.getBoundingClientRect();
      timeline.scrollLeft = anchorXRatio * newRect.width - viewportX;
      timeline.scrollTop = anchorYRatio * newRect.height - viewportY;
    }

    function startPinchZoom(event) {
      if (event.touches.length !== 2) return;

      event.preventDefault();
      stopAutoScroll();

      const rect = timelineSvg.getBoundingClientRect();
      const midpoint = getTouchMidpoint(event.touches);

      pinchStartDistance = getTouchDistance(event.touches);
      pinchStartZoom = zoom;
      pinchMidpointX = midpoint.x;
      pinchMidpointY = midpoint.y;
      pinchAnchorXRatio = rect.width ? (timeline.scrollLeft + midpoint.x) / rect.width : 0.5;
      pinchAnchorYRatio = rect.height ? (timeline.scrollTop + midpoint.y) / rect.height : 0.5;

      showControls();
    }

    function movePinchZoom(event) {
      if (event.touches.length !== 2 || !pinchStartDistance) return;

      event.preventDefault();

      const nextDistance = getTouchDistance(event.touches);
      const nextZoom = pinchStartZoom * (nextDistance / pinchStartDistance);

      setZoomAtViewportPoint(
        nextZoom,
        pinchMidpointX,
        pinchMidpointY,
        pinchAnchorXRatio,
        pinchAnchorYRatio
      );

      showControls();
    }

    function endPinchZoom(event) {
      if (event.touches.length >= 2) return;

      pinchStartDistance = null;
    }

    function addPinchZoomListeners(target) {
      if (window.PointerEvent) {
        target.addEventListener("pointerdown", startPointerPinchZoom, { passive: false });
        target.addEventListener("pointermove", movePointerPinchZoom, { passive: false });
        target.addEventListener("pointerup", endPointerPinchZoom, { passive: true });
        target.addEventListener("pointercancel", endPointerPinchZoom, { passive: true });
      } else {
        target.addEventListener("touchstart", startPinchZoom, { passive: false });
        target.addEventListener("touchmove", movePinchZoom, { passive: false });
        target.addEventListener("touchend", endPinchZoom, { passive: true });
        target.addEventListener("touchcancel", endPinchZoom, { passive: true });
      }
    }

    function startPointerPinchZoom(event) {
      if (event.pointerType !== "touch" && event.pointerType !== "pen") return;

      activePointers.set(event.pointerId, {
        clientX: event.clientX,
        clientY: event.clientY
      });

      if (activePointers.size === 1) {
        panPointerId = event.pointerId;
        panLastX = event.clientX;
        panLastY = event.clientY;
        panHasMoved = false;
      }

      if (activePointers.size !== 2) return;

      event.preventDefault();
      stopAutoScroll();

      const points = Array.from(activePointers.values());
      const rect = timelineSvg.getBoundingClientRect();
      const midpoint = getPointMidpoint(points);

      pinchStartDistance = getPointDistance(points);
      pinchStartZoom = zoom;
      pinchMidpointX = midpoint.x;
      pinchMidpointY = midpoint.y;
      pinchAnchorXRatio = rect.width ? (timeline.scrollLeft + midpoint.x) / rect.width : 0.5;
      pinchAnchorYRatio = rect.height ? (timeline.scrollTop + midpoint.y) / rect.height : 0.5;

      showControls();
    }

    function movePointerPinchZoom(event) {
      if (!activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        clientX: event.clientX,
        clientY: event.clientY
      });

      if (activePointers.size === 1 && event.pointerId === panPointerId) {
        const deltaX = event.clientX - panLastX;
        const deltaY = event.clientY - panLastY;

        if (Math.abs(deltaX) > 1 || Math.abs(deltaY) > 1) {
          panHasMoved = true;
          event.preventDefault();
          timeline.scrollLeft -= deltaX;
          timeline.scrollTop -= deltaY;
          panLastX = event.clientX;
          panLastY = event.clientY;
          showControls();
        }

        return;
      }

      if (activePointers.size !== 2 || !pinchStartDistance) return;

      event.preventDefault();

      const points = Array.from(activePointers.values());
      const nextDistance = getPointDistance(points);
      const nextZoom = pinchStartZoom * (nextDistance / pinchStartDistance);

      setZoomAtViewportPoint(
        nextZoom,
        pinchMidpointX,
        pinchMidpointY,
        pinchAnchorXRatio,
        pinchAnchorYRatio
      );

      showControls();
    }

    function endPointerPinchZoom(event) {
      activePointers.delete(event.pointerId);

      if (activePointers.size < 2) {
        pinchStartDistance = null;
      }

      if (event.pointerId === panPointerId) {
        panPointerId = null;
        panHasMoved = false;
      }
    }

    function setTimelineView(horizontalRatio, verticalRatio) {
      const rect = timelineSvg.getBoundingClientRect();

      timeline.scrollLeft = rect.width * horizontalRatio;
      timeline.scrollTop = rect.height * verticalRatio - timeline.clientHeight / 2;
    }

    function applyZoom(nextZoom) {
      zoom = Math.min(Math.max(nextZoom, 0.25), 6);
      updateTimelineSize();
    }

    function handleBrowserZoomShortcut(event) {
      if (!event.metaKey && !event.ctrlKey) return;

      if (event.key === "+" || event.key === "=") {
        event.preventDefault();
        setZoom(zoom + 0.4);
      }

      if (event.key === "-") {
        event.preventDefault();
        setZoom(zoom - 0.4);
      }

      if (event.key === "0") {
        event.preventDefault();
        setZoom(1);
      }
    }

    async function startTabletDisplayMode() {
      showControls();

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);
      }

      stopAutoScroll();
      timeline.scrollLeft = 0;
      timeline.scrollTop = 0;
      applyZoom(1);
      applyZoom(tabletDisplaySettings.zoom);

      requestAnimationFrame(() => {
        setTimelineView(tabletDisplaySettings.horizontalRatio, tabletDisplaySettings.verticalRatio);

        if (!autoScrolling) {
          direction = 1;
          startAutoScroll();
        }

        showControls();
      });
    }

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = "Exit";
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = "Full Screen";
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);
      }

      showControls();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "Exit" : "Full Screen";
      showControls();
    });

    function startAutoScroll() {
      autoScrolling = true;
      autoScrollBtn.textContent = "Stop Scroll";

      autoScrollTimer = setInterval(() => {
        const maxScroll = timeline.scrollWidth - timeline.clientWidth;

        if (maxScroll <= 0) return;

        timeline.scrollLeft += direction * 1;

        if (timeline.scrollLeft >= maxScroll) direction = -1;
        if (timeline.scrollLeft <= 0) direction = 1;
      }, 50);
    }

    function stopAutoScroll() {
      autoScrolling = false;
      autoScrollBtn.textContent = "Auto Scroll";
      clearInterval(autoScrollTimer);
    }

    autoScrollBtn.addEventListener("click", () => {
      if (autoScrolling) {
        stopAutoScroll();
      } else {
        startAutoScroll();
      }

      showControls();
    });

    tabletDisplayBtn.addEventListener("click", startTabletDisplayMode);

    zoomInBtn.addEventListener("click", () => setZoom(zoom + 0.4));
    zoomOutBtn.addEventListener("click", () => setZoom(zoom - 0.4));
    resetZoomBtn.addEventListener("click", () => setZoom(1));

    leftBtn.addEventListener("click", () => {
      timeline.scrollBy({ left: -400, behavior: "smooth" });
      showControls();
    });

    rightBtn.addEventListener("click", () => {
      timeline.scrollBy({ left: 400, behavior: "smooth" });
      showControls();
    });

    upBtn.addEventListener("click", () => {
      timeline.scrollBy({ top: -60, behavior: "smooth" });
      showControls();
    });

    downBtn.addEventListener("click", () => {
      timeline.scrollBy({ top: 60, behavior: "smooth" });
      showControls();
    });

    addInteractionListeners(document);
    addInteractionListeners(window);
    addInteractionListeners(timeline);
    addInteractionListeners(timelineSvg);
    addInteractionListeners(wakeLayer);
    addPinchZoomListeners(timeline);
    addPinchZoomListeners(timelineSvg);
    addPinchZoomListeners(wakeLayer);
    document.addEventListener("keydown", handleBrowserZoomShortcut);
    timelineSvg.addEventListener("load", addSvgInteractionListeners);

    window.addEventListener("resize", () => {
      setZoom(zoom);
      showControls();
    });

    if (window.visualViewport) {
      visualViewport.addEventListener("resize", showControls);
      visualViewport.addEventListener("scroll", showControls);
    }

    updateTimelineSize();
    measureTimelineSvg();
    showControls();
  </script>
</body>
</html>
