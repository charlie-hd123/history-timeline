<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>

  <style>
    /* Page basics */
    body {
      margin: 0;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
    }

    /* Timeline viewing area */
    #timeline {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: #e8e8e8;
    }

    /* Mobile timeline size */
    object {
      width: 3400px;
      height: auto;
      display: block;
    }

    /* Tablet timeline size */
    @media (min-width: 800px) {
      object {
        width: 6200px;
      }
    }

    /* Computer timeline size */
    @media (min-width: 1200px) {
      object {
        width: 7200px;
      }
    }
  </style>
</head>
<body>
  <!-- Timeline SVG -->
  <div id="timeline">
    <object data="assets/timeline.svg" type="image/svg+xml" aria-label="History timeline"></object>
  </div>

  <script>
    // Auto-scrolls the timeline slowly left and right
    const timeline = document.getElementById("timeline");
    let direction = 1;

    setInterval(() => {
      const maxScroll = timeline.scrollWidth - timeline.clientWidth;

      if (maxScroll <= 0) return;

      timeline.scrollLeft += direction;

      if (timeline.scrollLeft >= maxScroll) direction = -1;
      if (timeline.scrollLeft <= 0) direction = 1;
    }, 2000);
  </script>
</body>
</html>
