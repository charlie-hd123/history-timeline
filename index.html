<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
    }

    .timeline-container {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      background: #e8e8e8;
      -webkit-overflow-scrolling: touch;
    }

    .timeline-content {
      width: 4000px;
      height: 100vh;
    }

    .timeline-svg {
      width: 100%;
      height: 100vh;
      display: block;
      border: 0;
    }

    @media (min-width: 800px) {
      .timeline-content {
        width: 15000px;
      }
    }
  </style>
</head>
<body>
  <div class="timeline-container" id="timeline">
    <div class="timeline-content">
      <object
        data="assets/timeline.svg"
        type="image/svg+xml"
        class="timeline-svg"
        aria-label="History timeline">
      </object>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      const timeline = document.getElementById("timeline");

      let direction = 1;
      const speed = 0.5;

      function autoScroll() {
        const maxScroll = timeline.scrollWidth - timeline.clientWidth;

        timeline.scrollLeft += speed * direction;

        if (timeline.scrollLeft >= maxScroll) {
          direction = -1;
        }

        if (timeline.scrollLeft <= 0) {
          direction = 1;
        }

        requestAnimationFrame(autoScroll);
      }

      autoScroll();
    });
  </script>
</body>
</html>
