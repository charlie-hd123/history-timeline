<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>

  <style>
    /* Page basics */
    body {
      margin: 0;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
    }

    /* Fixed buttons */
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 6px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #dpad {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 42px);
      gap: 5px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #dpad.hidden {
      opacity: 0;
      pointer-events: none;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 6px;
      background: rgba(120, 120, 120, 0.82);
      color: white;
      font-size: 18px;
      cursor: pointer;
      min-width: 50px;
    }

    #controls button {
      padding: 14px 20px;
      font-size: 20px;
      min-width: 58px;
    }

    #dpad button {
      padding: 8px;
      font-size: 16px;
      min-width: 42px;
    }

    #upBtn {
      grid-column: 2;
      grid-row: 1;
    }

    #leftBtn {
      grid-column: 1;
      grid-row: 2;
    }

    #rightBtn {
      grid-column: 3;
      grid-row: 2;
    }

    #downBtn {
      grid-column: 2;
      grid-row: 3;
    }

    /* Timeline viewing area */
    #timeline {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: #e8e8e8;
    }

    /* Mobile timeline size */
    object {
      width: 3400px;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* Tablet timeline size */
    @media (min-width: 800px) {
      object {
        width: 6200px;
      }
    }

    /* Computer timeline size */
    @media (min-width: 1200px) {
      object {
        width: 7200px;
      }
    }
  </style>
</head>
<body>
  <!-- Buttons that stay fixed in the top-left corner -->
  <div id="controls">
    <button id="fullscreenBtn">Full Screen</button>
    <button id="zoomInBtn">+</button>
    <button id="zoomOutBtn">-</button>
  </div>

  <!-- Movement buttons in a D-pad layout -->
  <div id="dpad">
    <button id="upBtn">↑</button>
    <button id="leftBtn">←</button>
    <button id="rightBtn">→</button>
    <button id="downBtn">↓</button>
  </div>

  <!-- Timeline SVG -->
  <div id="timeline">
    <object id="timelineSvg" data="assets/timeline.svg" type="image/svg+xml" aria-label="History timeline"></object>
  </div>

  <script>
    // Auto-scrolls the timeline slowly left and right
    const timeline = document.getElementById("timeline");
    const timelineSvg = document.getElementById("timelineSvg");
    const controls = document.getElementById("controls");
    const dpad = document.getElementById("dpad");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const upBtn = document.getElementById("upBtn");
    const downBtn = document.getElementById("downBtn");

    let direction = 1;
    let zoom = 1;
    let hideControlsTimer;

    function getBaseWidth() {
      if (window.innerWidth >= 1200) return 7200;
      if (window.innerWidth >= 800) return 6200;
      return 3400;
    }

    function showControls() {
      controls.classList.remove("hidden");
      dpad.classList.remove("hidden");
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        controls.classList.add("hidden");
        dpad.classList.add("hidden");
      }, 5000);
    }

    function setZoom(nextZoom) {
      const oldWidth = timelineSvg.offsetWidth;
      const oldCenter = timeline.scrollLeft + timeline.clientWidth / 2;

      zoom = Math.min(Math.max(nextZoom, 0.25), 6);
      timelineSvg.style.width = `${getBaseWidth() * zoom}px`;

      const newWidth = timelineSvg.offsetWidth;
      timeline.scrollLeft = (oldCenter / oldWidth) * newWidth - timeline.clientWidth / 2;

      showControls();
    }

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = "Exit";
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = "Full Screen";
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);
      }

      showControls();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "Exit" : "Full Screen";
      showControls();
    });

    zoomInBtn.addEventListener("click", () => setZoom(zoom + 0.4));
    zoomOutBtn.addEventListener("click", () => setZoom(zoom - 0.4));

    leftBtn.addEventListener("click", () => {
      timeline.scrollBy({ left: -400, behavior: "smooth" });
      showControls();
    });

    rightBtn.addEventListener("click", () => {
      timeline.scrollBy({ left: 400, behavior: "smooth" });
      showControls();
    });

    upBtn.addEventListener("click", () => {
      window.scrollBy({ top: -300, behavior: "smooth" });
      showControls();
    });

    downBtn.addEventListener("click", () => {
      window.scrollBy({ top: 300, behavior: "smooth" });
      showControls();
    });

    ["scroll", "wheel", "touchmove", "pointermove", "keydown"].forEach((eventName) => {
      document.addEventListener(eventName, showControls, { passive: true });
    });

    window.addEventListener("resize", () => {
      setZoom(zoom);
      showControls();
    });

    if (window.visualViewport) {
      visualViewport.addEventListener("resize", showControls);
      visualViewport.addEventListener("scroll", showControls);
    }

    setInterval(() => {
      const maxScroll = timeline.scrollWidth - timeline.clientWidth;

      if (maxScroll <= 0) return;

      timeline.scrollLeft += direction;

      if (timeline.scrollLeft >= maxScroll) direction = -1;
      if (timeline.scrollLeft <= 0) direction = 1;
    }, 2000);

    showControls();
  </script>
</body>
</html>
