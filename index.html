<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>
  <style>
    body {
      margin: 0;
      background: #f6f6f6;
      font-family: Arial, sans-serif;
    }

    .timeline-container {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      background: white;
    }

    .timeline-container img {
      height: 100vh;
      width: auto;
      max-width: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="timeline-container">
    <img src="assets/timeline.svg" alt="History timeline">
  </div>
</body>
</html>
