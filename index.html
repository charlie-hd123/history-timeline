<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>

  <style>
    html,
    body {
      margin: 0;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
    }

    .timeline-container {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: #e8e8e8;
    }

    .timeline-svg {
      width: 4000px;
      height: auto;
      display: block;
      border: 0;
    }

    @media (min-width: 800px) {
      .timeline-svg {
        width: 15000px;
      }
    }
  </style>
</head>

<body>
  <div class="timeline-container" id="timeline">
    <object
      data="assets/timeline.svg"
      type="image/svg+xml"
      class="timeline-svg"
      aria-label="History timeline">
    </object>
  </div>

  <script>
    const timeline = document.getElementById("timeline");
    const svgObject = document.querySelector(".timeline-svg");

    let direction = 1;

    // Pixels per second
    const speed = 5;

    let precisePosition = 0;
    let lastTime = null;

    function startAutoScroll() {
      timeline.scrollLeft = 0;
      precisePosition = 0;
      direction = 1;
      lastTime = null;

      function autoScroll(timestamp) {
        if (!lastTime) {
          lastTime = timestamp;
        }

        const deltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        const maxScroll = timeline.scrollWidth - timeline.clientWidth;

        if (maxScroll > 0) {
          precisePosition += speed * direction * deltaTime;

          if (precisePosition >= maxScroll) {
            precisePosition = maxScroll;
            direction = -1;
          }

          if (precisePosition <= 0) {
            precisePosition = 0;
            direction = 1;
          }

          timeline.scrollLeft = precisePosition;
        }

        requestAnimationFrame(autoScroll);
      }

      requestAnimationFrame(autoScroll);
    }

    svgObject.addEventListener("load", startAutoScroll);

    setTimeout(startAutoScroll, 1000);
  </script>
</body>
</html>
