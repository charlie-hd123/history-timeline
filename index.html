<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Timeline</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f6f6f6;
      font-family: Arial, sans-serif;
      overflow: auto;
    }

    .timeline-container {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background: white;
    }

    .timeline-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
      zoom: 0.7;
    }
  </style>
</head>
<body>
  <div class="timeline-container">
    <iframe
      class="timeline-frame"
      src="assets/timeline.svg"
      title="History Timeline">
    </iframe>
  </div>
</body>
</html>
