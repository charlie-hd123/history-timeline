
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>History Timeline</title>

  <style>
    /* Page basics */
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Fixed buttons */
    #controls {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: calc(100vw - 36px);
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(96, 96, 96, 0.72);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      opacity: 1;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }

    #zoomControls {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(96, 96, 96, 0.72);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      opacity: 1;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }

    #controls.hidden,
    #zoomControls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #wakeLayer {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: transparent;
      display: none;
    }

    #wakeLayer.active {
      display: block;
    }

    #timelineProgress {
      position: fixed;
      left: var(--progress-left, 50%);
      bottom: var(--progress-bottom, 18px);
      z-index: 12;
      width: var(--progress-width, min(520px, 44vw));
      min-width: 280px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 8px;
      background: rgba(48, 48, 48, 0.68);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      color: white;
      opacity: 0.92;
      transform: translateX(var(--progress-shift, -50%));
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0s linear 0s;
      backdrop-filter: blur(10px);
      user-select: none;
      -webkit-user-select: none;
    }

    #timelineProgress.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }

    #timelineProgressTrack {
      position: relative;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      cursor: pointer;
      touch-action: none;
    }

    #timelineProgressFill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ececec 0%, #c8c8c8 45%, #9a9a9a 100%);
    }

    #timelineProgressMarker {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 999px;
      background: #1e1e1e;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%);
    }

    #fullscreenNotice {
      position: fixed;
      top: 72px;
      left: 10px;
      right: 10px;
      z-index: 20;
      box-sizing: border-box;
      max-width: 420px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.86);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      color: white;
      font-size: 14px;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      backdrop-filter: blur(8px);
    }

    @media (min-width: 520px) {
      #fullscreenNotice {
        right: auto;
      }
    }

    #fullscreenNotice.visible {
      opacity: 1;
      transform: translateY(0);
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.15;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      white-space: nowrap;
      min-width: 44px;
    }

    button:active {
      background: rgba(255, 255, 255, 0.16);
    }

    button:focus,
    button:focus-visible {
      outline: none;
    }

    #controls button {
      min-height: 42px;
      min-width: 52px;
    }

    #tabletDisplayBtn {
      display: none;
    }

    #tabletDisplayBtn[hidden] {
      display: none;
    }

    #zoomControls button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      min-height: 42px;
      padding: 4px;
      font-size: 26px;
      line-height: 1;
    }

    #zoomControls #zoomOutBtn {
      font-size: 29px;
      padding-bottom: 3px;
    }

    /* Timeline viewing area */
    #timeline {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: auto;
      background: #e8e8e8;
      overscroll-behavior: none;
      scrollbar-width: none;
      touch-action: pan-x pan-y;
    }

    #timeline::-webkit-scrollbar {
      display: none;
    }

    /* Mobile timeline size */
    #timelineSvg {
      width: 7600px;
      height: auto;
      display: block;
      margin-top: var(--timeline-offset-y, 0px);
      touch-action: pan-x pan-y;
    }

    #timelineSvg > svg,
    #timelineSvgFallback {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: pan-x pan-y;
    }

    /* Tablet timeline size */
    @media (min-width: 800px) {
      #timelineSvg {
        width: 13000px;
      }
    }

    @media (min-width: 800px) and (pointer: coarse) {
      #tabletDisplayBtn {
        display: inline-block;
      }

      #tabletDisplayBtn[hidden] {
        display: none;
      }
    }

    /* Computer timeline size */
    @media (min-width: 1200px) {
      #timelineSvg {
        width: 16000px;
      }
    }

    @media (max-width: 799px) {
      #controls {
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        max-width: calc(100vw - 20px);
        padding: 4px;
        gap: 4px;
      }

      #zoomControls {
        right: 10px;
        top: max(10px, env(safe-area-inset-top));
        padding: 4px;
        gap: 5px;
      }

      #timelineProgress {
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 14px);
        width: min(340px, calc(100vw - 24px));
        min-width: 0;
        padding: 8px 9px;
        border-radius: 7px;
      }

      button {
        border-radius: 5px;
        font-size: 10px;
        padding: 5px 7px;
        min-width: 30px;
      }

      #controls button {
        min-height: 28px;
        min-width: 32px;
      }

      #zoomControls button {
        min-width: 28px;
        min-height: 28px;
        font-size: 19px;
      }

      #zoomControls #zoomOutBtn {
        font-size: 22px;
        padding-bottom: 2px;
      }
    }

    @media (max-height: 500px) and (max-width: 950px) {
      #controls {
        top: 10px;
        left: 10px;
        max-width: calc(100vw - 20px);
        padding: 4px;
        gap: 4px;
      }

      #zoomControls {
        right: 10px;
        top: 10px;
        padding: 4px;
        gap: 5px;
      }

      #timelineProgress {
        bottom: 24px;
        width: min(340px, calc(100vw - 24px));
        min-width: 0;
        padding: 8px 9px;
      }

      button {
        border-radius: 5px;
        font-size: 10px;
        padding: 5px 7px;
        min-width: 30px;
      }

      #controls button {
        min-height: 28px;
        min-width: 32px;
      }

      #zoomControls button {
        min-width: 28px;
        min-height: 28px;
        font-size: 19px;
      }

      #zoomControls #zoomOutBtn {
        font-size: 22px;
        padding-bottom: 2px;
      }
    }
  </style>
</head>
<body>
  <div id="wakeLayer" aria-hidden="true"></div>
  <div id="fullscreenNotice" role="status" aria-live="polite"></div>

  <!-- Main controls -->
  <div id="controls">
    <button id="fullscreenBtn">Full Screen</button>
    <button id="resetViewBtn">Reset View</button>
    <button id="tabletDisplayBtn">Tablet Display Mode</button>
    <button id="autoScrollBtn">Auto Scroll</button>
  </div>

  <!-- Timeline zoom controls -->
  <div id="zoomControls">
    <button id="zoomOutBtn">−</button>
    <button id="zoomInBtn">+</button>
  </div>

  <div id="timelineProgress" aria-label="Timeline position">
    <div id="timelineProgressTrack">
      <div id="timelineProgressFill"></div>
      <div id="timelineProgressMarker"></div>
    </div>
  </div>

  <!-- Timeline SVG -->
  <div id="timeline">
    <div id="timelineSvg" role="img" aria-label="History timeline">
      <object id="timelineSvgFallback" data="assets/timeline.svg" type="image/svg+xml" aria-label="History timeline"></object>
    </div>
  </div>

  <script>
    // Auto-scrolls the timeline slowly left and right
    const timeline = document.getElementById("timeline");
    const timelineSvg = document.getElementById("timelineSvg");
    const timelineSvgFallback = document.getElementById("timelineSvgFallback");
    const controls = document.getElementById("controls");
    const zoomControls = document.getElementById("zoomControls");
    const wakeLayer = document.getElementById("wakeLayer");
    const timelineProgress = document.getElementById("timelineProgress");
    const timelineProgressTrack = document.getElementById("timelineProgressTrack");
    const timelineProgressFill = document.getElementById("timelineProgressFill");
    const timelineProgressMarker = document.getElementById("timelineProgressMarker");
    const fullscreenNotice = document.getElementById("fullscreenNotice");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const autoScrollBtn = document.getElementById("autoScrollBtn");
    const tabletDisplayBtn = document.getElementById("tabletDisplayBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const timelineSvgPath = "assets/timeline.svg";
    const zoomStep = 0.15;
    const desktopDefaultZoom = 1.45;
    const defaultZoom = isTabletDevice() ? desktopDefaultZoom - zoomStep * 3 : desktopDefaultZoom;
    const tabletDisplaySettings = {
      zoom: 3,
      horizontalRatio: 0,
      verticalRatio: 0.26,
      topOffset: 0
    };

    let direction = 1;
    let zoom = defaultZoom;
    let hideControlsTimer;
    let autoScrollTimer;
    let fullscreenNoticeTimer;
    let autoScrolling = false;
    let tabletDisplayModeActive = false;
    let svgAspectRatio = null;
    let initialViewApplied = false;
    let progressUpdateQueued = false;
    let draggingTimelineProgress = false;
    const interactionEvents = [
      "click",
      "mousedown",
      "mousemove",
      "pointerdown",
      "pointermove",
      "touchmove",
      "touchstart",
      "wheel",
      "keydown"
    ];

    function isTabletDevice() {
      return window.matchMedia("(min-width: 800px) and (pointer: coarse)").matches;
    }

    function isHandheldAppleDevice() {
      const platform = navigator.platform || "";
      const userAgent = navigator.userAgent || "";
      const isiPhoneOrIPad = /iPhone|iPad|iPod/.test(userAgent);
      const isIPadOS = platform === "MacIntel" && navigator.maxTouchPoints > 1;

      return isiPhoneOrIPad || isIPadOS;
    }

    function showFullscreenNotice() {
      const controlsRect = controls.getBoundingClientRect();
      const narrowScreen = window.innerWidth < 520;

      fullscreenNotice.textContent = "Full screen may be blocked on iPhone and iPad. For the cleanest view, hide the browser toolbar from the menu, or add this page to your Home Screen and open it from there.";
      fullscreenNotice.style.left = narrowScreen ? "10px" : `${Math.max(8, controlsRect.left)}px`;
      fullscreenNotice.style.top = `${Math.min(window.innerHeight - 80, controlsRect.bottom + 8)}px`;
      fullscreenNotice.classList.add("visible");

      clearTimeout(fullscreenNoticeTimer);
      fullscreenNoticeTimer = setTimeout(() => {
        fullscreenNotice.classList.remove("visible");
      }, 8500);
    }

    function getBaseWidth() {
      if (window.innerWidth >= 1200) return 16000;
      if (window.innerWidth >= 800) return 13000;
      return 7600;
    }

    function updateTimelineSize() {
      const width = getBaseWidth() * zoom;

      timelineSvg.style.width = `${width}px`;

      if (svgAspectRatio) {
        timelineSvg.style.height = `${width * svgAspectRatio}px`;
      }
    }

    function measureTimelineSvg() {
      const measurementImage = document.createElement("img");

      measurementImage.addEventListener("load", () => {
        if (measurementImage.naturalWidth > 0 && measurementImage.naturalHeight > 0) {
          svgAspectRatio = measurementImage.naturalHeight / measurementImage.naturalWidth;
          updateTimelineSize();
          setDefaultView();
        }
      });

      measurementImage.src = timelineSvgPath;
    }

    async function loadInlineTimelineSvg() {
      try {
        const response = await fetch(timelineSvgPath);
        if (!response.ok) return;

        const svgText = await response.text();
        const svgDocument = new DOMParser().parseFromString(svgText, "image/svg+xml");
        const svgElement = svgDocument.documentElement;

        if (svgElement.tagName.toLowerCase() !== "svg") return;

        svgElement.removeAttribute("width");
        svgElement.removeAttribute("height");
        svgElement.setAttribute("focusable", "false");
        svgElement.style.width = "100%";
        svgElement.style.height = "100%";
        svgElement.style.display = "block";

        timelineSvg.replaceChildren(document.importNode(svgElement, true));
        addInteractionListeners(timelineSvg);
        blockBrowserPinchZoom(timelineSvg);
        updateTimelineSize();
        setDefaultView();
      } catch (error) {
        console.warn("Inline SVG loading is unavailable; using embedded fallback.", error);
      }
    }

    function stopBrowserPinchZoom(event) {
      if (event.touches && event.touches.length > 1) {
        event.preventDefault();
      }
    }

    function blockBrowserPinchZoom(target) {
      target.addEventListener("touchmove", stopBrowserPinchZoom, { passive: false });
      target.addEventListener("gesturestart", (event) => event.preventDefault(), { passive: false });
      target.addEventListener("gesturechange", (event) => event.preventDefault(), { passive: false });
    }

    function showControls() {
      updateProgressLayout();
      controls.classList.remove("hidden");
      zoomControls.classList.remove("hidden");
      timelineProgress.classList.remove("hidden");
      wakeLayer.classList.remove("active");
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        controls.classList.add("hidden");
        zoomControls.classList.add("hidden");
        timelineProgress.classList.add("hidden");
        wakeLayer.classList.add("active");
      }, 5000);
    }

    function addInteractionListeners(target) {
      interactionEvents.forEach((eventName) => {
        target.addEventListener(eventName, showControls, { passive: true });
      });
    }

    function getTimelineProgress() {
      const maxScroll = timeline.scrollWidth - timeline.clientWidth;

      if (maxScroll <= 0) return 0;

      return Math.min(Math.max(timeline.scrollLeft / maxScroll, 0), 1);
    }

    function updateTimelineProgress() {
      const progress = getTimelineProgress();
      const percent = Math.round(progress * 100);

      timelineProgressFill.style.width = `${percent}%`;
      timelineProgressMarker.style.left = `${percent}%`;
      progressUpdateQueued = false;
    }

    function requestTimelineProgressUpdate() {
      if (progressUpdateQueued) return;

      progressUpdateQueued = true;
      requestAnimationFrame(updateTimelineProgress);
    }

    function resetProgressLayout() {
      timelineProgress.style.removeProperty("--progress-left");
      timelineProgress.style.removeProperty("--progress-bottom");
      timelineProgress.style.removeProperty("--progress-width");
      timelineProgress.style.removeProperty("--progress-shift");
    }

    function updateProgressLayout() {
      resetProgressLayout();
    }

    function setTimelineProgressFromClientX(clientX, behavior = "auto") {
      const rect = timelineProgressTrack.getBoundingClientRect();
      const progress = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
      const maxScroll = timeline.scrollWidth - timeline.clientWidth;

      timeline.scrollTo({ left: maxScroll * progress, behavior });
      requestTimelineProgressUpdate();
    }

    function seekTimelineFromProgress(event) {
      setTimelineProgressFromClientX(event.clientX, "smooth");
      showControls();
    }

    function startTimelineProgressDrag(event) {
      draggingTimelineProgress = true;
      timelineProgressTrack.setPointerCapture?.(event.pointerId);
      setTimelineProgressFromClientX(event.clientX);
      event.preventDefault();
      showControls();
    }

    function dragTimelineProgress(event) {
      if (!draggingTimelineProgress) return;

      setTimelineProgressFromClientX(event.clientX);
      event.preventDefault();
      showControls();
    }

    function stopTimelineProgressDrag(event) {
      if (!draggingTimelineProgress) return;

      draggingTimelineProgress = false;
      timelineProgressTrack.releasePointerCapture?.(event.pointerId);
      showControls();
    }

    function addSvgInteractionListeners() {
      try {
        const svgDocument = timelineSvgFallback.contentDocument || timelineSvgFallback.getSVGDocument?.();
        const svgWindow = svgDocument?.defaultView;

        if (svgDocument) addInteractionListeners(svgDocument);
        if (svgWindow) addInteractionListeners(svgWindow);
        if (svgDocument) blockBrowserPinchZoom(svgDocument);
        if (svgWindow) blockBrowserPinchZoom(svgWindow);
      } catch (error) {
        console.warn("Could not attach timeline interaction listeners.", error);
      }
    }

    function getUsableViewportCenter() {
      const padding = 10;
      const controlsRect = controls.classList.contains("hidden")
        ? { bottom: 0 }
        : controls.getBoundingClientRect();
      const zoomRect = zoomControls.classList.contains("hidden")
        ? { bottom: 0 }
        : zoomControls.getBoundingClientRect();
      const progressRect = timelineProgress.classList.contains("hidden")
        ? { top: timeline.clientHeight }
        : timelineProgress.getBoundingClientRect();
      const top = Math.max(0, controlsRect.bottom || 0, zoomRect.bottom || 0) + padding;
      const bottomOverlayTop = Math.min(
        timeline.clientHeight,
        progressRect.top || timeline.clientHeight
      );
      const bottom = Math.max(top + 1, bottomOverlayTop - padding);

      return {
        x: timeline.clientWidth / 2,
        y: (top + bottom) / 2
      };
    }

    function setZoom(nextZoom) {
      const center = getUsableViewportCenter();
      const oldRect = timelineSvg.getBoundingClientRect();
      const oldCenterX = timeline.scrollLeft + center.x;
      const oldCenterY = timeline.scrollTop + center.y;
      const centerXRatio = oldRect.width ? oldCenterX / oldRect.width : 0.5;
      const centerYRatio = oldRect.height ? oldCenterY / oldRect.height : 0.5;

      applyZoom(nextZoom);

      requestAnimationFrame(() => {
        const newRect = timelineSvg.getBoundingClientRect();

        timeline.scrollLeft = centerXRatio * newRect.width - center.x;
        timeline.scrollTop = centerYRatio * newRect.height - center.y;

        showControls();
      });
    }

    function setTimelineView(horizontalRatio, verticalRatio) {
      const rect = timelineSvg.getBoundingClientRect();

      timeline.scrollLeft = rect.width * horizontalRatio;
      timeline.scrollTop = rect.height * verticalRatio - timeline.clientHeight / 2;
    }

    function setTimelineTopOffset(offset) {
      timelineSvg.style.setProperty("--timeline-offset-y", `${offset}px`);
    }

    function setTabletDisplayModeActive(active) {
      tabletDisplayModeActive = active;
      tabletDisplayBtn.hidden = active;
    }

    function applyTabletDisplayView() {
      setTimelineView(tabletDisplaySettings.horizontalRatio, tabletDisplaySettings.verticalRatio);
    }

    function applyZoom(nextZoom) {
      zoom = Math.min(Math.max(nextZoom, 0.25), 6);
      updateTimelineSize();
    }

    function handleBrowserZoomShortcut(event) {
      if (!event.metaKey && !event.ctrlKey) return;

      const key = event.key;
      const code = event.code;
      const isZoomIn = key === "+" || key === "=" || code === "Equal" || code === "NumpadAdd";
      const isZoomOut = key === "-" || code === "Minus" || code === "NumpadSubtract";
      const isReset = key === "0" || code === "Digit0" || code === "Numpad0";

      if (!isZoomIn && !isZoomOut && !isReset) return;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();

      if (isZoomIn) setZoom(zoom + zoomStep);
      if (isZoomOut) setZoom(zoom - zoomStep);
      if (isReset) {
        resetView();
      }
    }

    function releaseButtonFocus(event) {
      const button = event.currentTarget;
      setTimeout(() => button.blur(), 0);
    }

    function addButtonAction(button, action) {
      let lastDirectActionTime = 0;

      function runDirectAction(event) {
        const now = Date.now();

        if (now - lastDirectActionTime < 350) return;

        lastDirectActionTime = now;

        if (event.cancelable) {
          event.preventDefault();
        }

        action(event);
        releaseButtonFocus(event);
      }

      button.addEventListener("pointerup", (event) => {
        if (event.pointerType !== "touch" && event.pointerType !== "pen") return;

        runDirectAction(event);
      });

      button.addEventListener("touchend", (event) => {
        runDirectAction(event);
      }, { passive: false });

      button.addEventListener("touchcancel", releaseButtonFocus, { passive: true });

      button.addEventListener("pointercancel", releaseButtonFocus);

      button.addEventListener("pointerdown", () => {
        button.style.pointerEvents = "auto";
      });

      button.addEventListener("click", (event) => {
        if (Date.now() - lastDirectActionTime < 500) {
          event.preventDefault();
          return;
        }

        action(event);
        releaseButtonFocus(event);
      });
    }

    function refreshAfterViewportChange() {
      const previousScrollLeft = timeline.scrollLeft;
      const previousScrollTop = timeline.scrollTop;

      updateTimelineSize();
      updateProgressLayout();
      requestTimelineProgressUpdate();
      timeline.scrollLeft = previousScrollLeft;
      timeline.scrollTop = previousScrollTop;
      showControls();

      setTimeout(() => {
        updateTimelineSize();
        updateProgressLayout();
        requestTimelineProgressUpdate();
        timeline.scrollLeft = previousScrollLeft;
        timeline.scrollTop = previousScrollTop;
        showControls();
      }, 350);
    }

    function setDefaultView() {
      if (initialViewApplied) return;

      requestAnimationFrame(() => {
        timeline.scrollLeft = 0;
        timeline.scrollTop = 0;
        initialViewApplied = true;
      });
    }

    function resetView() {
      setTimelineTopOffset(0);
      setTabletDisplayModeActive(false);
      applyZoom(defaultZoom);
      timeline.scrollLeft = 0;
      timeline.scrollTop = 0;
      showControls();
    }

    async function startTabletDisplayMode() {
      showControls();

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);
      }

      stopAutoScroll();
      timeline.scrollLeft = 0;
      timeline.scrollTop = 0;
      applyZoom(defaultZoom);
      applyZoom(tabletDisplaySettings.zoom);
      setTimelineTopOffset(tabletDisplaySettings.topOffset);
      setTabletDisplayModeActive(true);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          applyTabletDisplayView();
        });

        setTimeout(applyTabletDisplayView, 250);

        if (!autoScrolling) {
          direction = 1;
          startAutoScroll();
        }

        showControls();
      });
    }

    addButtonAction(fullscreenBtn, async () => {
      if (isHandheldAppleDevice() && !document.fullscreenElement) {
        showFullscreenNotice();
      }

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = "Exit";
        } else {
          await document.exitFullscreen();
          fullscreenBtn.textContent = "Full Screen";
        }
      } catch (error) {
        console.warn("Fullscreen is not available on this device.", error);

        if (isHandheldAppleDevice()) {
          showFullscreenNotice();
        }
      }

      showControls();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "Exit" : "Full Screen";

      if (!document.fullscreenElement && tabletDisplayModeActive) {
        setTimelineTopOffset(0);
        setTabletDisplayModeActive(false);
      }

      showControls();
    });

    function startAutoScroll() {
      autoScrolling = true;
      autoScrollBtn.textContent = "Stop Scroll";

      autoScrollTimer = setInterval(() => {
        const maxScroll = timeline.scrollWidth - timeline.clientWidth;

        if (maxScroll <= 0) return;

        timeline.scrollLeft += direction * 1;

        if (timeline.scrollLeft >= maxScroll) direction = -1;
        if (timeline.scrollLeft <= 0) direction = 1;

        requestTimelineProgressUpdate();
      }, 50);
    }

    function stopAutoScroll() {
      autoScrolling = false;
      autoScrollBtn.textContent = "Auto Scroll";
      clearInterval(autoScrollTimer);
    }

    addButtonAction(autoScrollBtn, () => {
      if (autoScrolling) {
        stopAutoScroll();
      } else {
        startAutoScroll();
      }

      showControls();
    });

    addButtonAction(tabletDisplayBtn, startTabletDisplayMode);

    addButtonAction(zoomInBtn, () => setZoom(zoom + zoomStep));
    addButtonAction(zoomOutBtn, () => setZoom(zoom - zoomStep));
    addButtonAction(resetViewBtn, resetView);

    timeline.addEventListener("scroll", requestTimelineProgressUpdate, { passive: true });
    timelineProgressTrack.addEventListener("click", seekTimelineFromProgress);
    timelineProgressTrack.addEventListener("pointerdown", startTimelineProgressDrag);
    timelineProgressTrack.addEventListener("pointermove", dragTimelineProgress);
    timelineProgressTrack.addEventListener("pointerup", stopTimelineProgressDrag);
    timelineProgressTrack.addEventListener("pointercancel", stopTimelineProgressDrag);

    addInteractionListeners(document);
    addInteractionListeners(window);
    addInteractionListeners(timeline);
    addInteractionListeners(timelineSvg);
    addInteractionListeners(wakeLayer);
    blockBrowserPinchZoom(document);
    blockBrowserPinchZoom(timeline);
    blockBrowserPinchZoom(timelineSvg);
    blockBrowserPinchZoom(wakeLayer);
    [
      fullscreenBtn,
      autoScrollBtn,
      tabletDisplayBtn,
      zoomInBtn,
      zoomOutBtn,
      resetViewBtn
    ].forEach((button) => {
      button.addEventListener("blur", releaseButtonFocus);
    });
    window.addEventListener("keydown", handleBrowserZoomShortcut, { capture: true });
    document.addEventListener("keydown", handleBrowserZoomShortcut, { capture: true });
    timelineSvgFallback.addEventListener("load", addSvgInteractionListeners);

    window.addEventListener("resize", () => {
      setZoom(zoom);
      refreshAfterViewportChange();
    });

    window.addEventListener("orientationchange", refreshAfterViewportChange);

    if (window.visualViewport) {
      visualViewport.addEventListener("resize", refreshAfterViewportChange);
    }

    updateTimelineSize();
    updateProgressLayout();
    updateTimelineProgress();
    measureTimelineSvg();
    loadInlineTimelineSvg();
    showControls();
  </script>
</body>
</html>
